
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Manager</title>
</head>
<body>
    <h1>To-Do Manager</h1>

    <form action="/submittodoitem" method="POST">
        <label for="itemName">Item Name:</label>
        <input
            type="text"
            id="itemName"
            name="itemName"
            required
        >

        <br><br>

        <label for="itemDescription">Item Description:</label>
        <textarea
            id="itemDescription"
            name="itemDescription"
            required
        ></textarea>

        <br><br>
        
<label for="itemId">Item ID:</label>
<input type="number" id="itemId" name="itemId" required>

<br><br>

<label for="itemUuid">Item UUID:</label>
<input type="text" id="itemUuid" name="itemUuid" required>

<br><br>

<label for="itemHash">Item Hash:</label>
<input type="text" id="itemHash" name="itemHash" required>

<br><br>


        <button type="submit">Submit Item</button>
    </form>
</body>
</html>
